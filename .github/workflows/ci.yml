name: ci

# CI is the third runner, alongside the phone and the laptop: it exists only for
# the claims neither dev host can make. `go test -race` refuses on android/arm64,
# and there is no Chromium on the phone. Everything it runs could be run on a
# dev host except those, and the same suite still does run there — this adds, it
# does not move the source of truth (AGENTS.md, "Verify").
#
# It never touches the deployed origin. `npm run tall` is deliberately absent:
# the probes measure a real link and are meaningless anywhere but a real device,
# and running them here would create matches on the live public server. The
# browser job looks like it has the same problem and does not — the config boots
# the app locally when no origin is given, so nothing outside the runner is
# touched. See docs/development/verification.md and
# docs/tasks/closed/in-repo-browser-fixture.md.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # gofmt is a gate here (AGENTS.md, "Verify") but not in a form CI can use
      # directly: `gofmt -l .` prints offending files and exits 0, so the check
      # has to fail on non-empty output.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      # The race detector needs cgo, so it is a separate step: if the plain
      # suite already fails, a race report against it says less.
      - run: go test -race ./...

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Both are origin-free by construction — that property is pinned by
      # tools/lib/harness.test.mjs and recorded in
      # docs/tasks/closed/unit-gate-needs-origin.md — so they run with no server
      # behind them. `npm run unit` is the catch-all for the client and harness
      # tests; the shorter `node --test` form in the README misses the
      # web/app.*.test.cjs files.
      - run: npm run unit
      - run: npm run links

  # The render gate: what neither `go test` nor the probes can observe — a tab
  # that really acks, really unlocks a move, and really paints a result, with
  # any console error failing the test. It is here because the phone has no
  # Chromium, which is why the suite was previously laptop-only.
  #
  # This job is origin-free, and that is load-bearing rather than incidental:
  # playwright.config.mjs boots the app itself through `webServer` when no
  # origin is given, so no secret is needed and no match is created anywhere a
  # player can see. See docs/tasks/closed/in-repo-browser-fixture.md.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The fixture compiles the server, so Go is needed even though the specs
      # never call it directly.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser suite
        run: npm run e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
