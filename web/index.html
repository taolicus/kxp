<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KACHIPUN TOURNAMENT</title>
<!-- A raised fist (the rock), drawn as an inline SVG rather than a file: the
     emoji renders in the tab at any scale and there is no second asset to
     cache-bust across deploys. Angle brackets and spaces are percent-encoded
     so the URI survives the attribute. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%E2%9C%8A%3C/text%3E%3C/svg%3E">
<link rel="preload" href="/MKX-Title.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="app">

  <!-- Cancelled-handshake notice. Deliberately outside the view sections so the
       same copy can appear over the lobby or the queue: a CPU timeout returns
       the player to the lobby, a PvP one puts them back in the queue, and both
       need the same explanation. -->
  <p id="notice" class="note hidden"></p>

  <section id="lobby" class="view">
    <h1 class="mkx-title">KACHIPUN TOURNAMENT</h1>
    <p id="online" class="online">&hellip;</p>
    <p id="stats" class="stats"></p>
    <!-- The length and draw rule a match runs as, chosen before the button it
         qualifies. The numbers live in the markup because they are a choice the
         player reads here; app.js posts whatever is selected and the server
         decides whether it is one it offers. The rule rides with the length
         because the length alone does not say what a drawn round does, and
         online takes the same choice (the queue pairs entries that agree on
         both). -->
    <div id="cpu-length" class="seg" role="group" aria-label="Match mode">
      <span class="seg-label">Mode:</span>
      <!-- No option is marked selected: the client decides, once the lobby
           is framed, so a saved choice is shown from the first paint instead of
           the default flashing and then being swapped out. The rule goes with
           the length: one round is a 1-off (a draw ends the match), and first
           to three replays a draw. A drawn first-to-1 is not a lobby choice --
           it is what a ladder floor asks for, posted from the arcade, not from
           here. -->
      <button class="seg-btn" data-rounds="1" data-draw-ends="true">1 round</button>
      <button class="seg-btn" data-rounds="3" data-draw-ends="false">First to 3</button>
    </div>
    <div class="buttons">
      <button id="btn-online" class="primary" disabled>Play Online</button>
      <button id="btn-cpu">Play vs CPU</button>
      <button id="btn-ladder">Arcade Mode</button>
      <!--<button id="btn-challenge">Challenge a Friend</button>-->
      <!-- The record of the matches this browser finished, behind its own button
           rather than a fourth mode: it opens something that already exists, and
           it has no request of its own to post. -->
      <button id="btn-history">Match History</button>
    </div>
  </section>

  <section id="choose" class="view hidden">
    <h2>Choose your fighter</h2>
    <div id="fighters" class="fighters" aria-label="Choose your fighter"></div>
    <div class="buttons">
      <button id="btn-start" class="primary">Fight</button>
      <button id="btn-back">Change mode</button>
    </div>
  </section>

  <section id="queue" class="view hidden">
    <h2>Searching for an opponent&hellip;</h2>
    <div id="challenge-link" class="hidden" style="margin-top:1em;text-align:center">
      <p>Share this link with your friend:</p>
      <input id="challenge-url" readonly style="width:80%;max-width:30em;padding:0.5em">
      <button id="btn-copy">Copy</button>
    </div>
    <div class="spinner"></div>
    <button id="btn-cancel">Cancel</button>
  </section>

  <section id="game" class="view hidden">
    <div class="fighters-bar">
      <div class="fighter-col">
        <div id="you-slot" class="slot"></div>
        <div id="you-pips" class="pips hidden"></div>
      </div>
      <div class="vs-tag">VS</div>
      <div class="fighter-col">
        <div id="opp-slot" class="slot"></div>
        <div id="opp-pips" class="pips hidden"></div>
      </div>
    </div>
    <div id="stage" class="stage">
      <div id="count" class="count">&#8203;</div>
    </div>
    <div class="moves">
      <button class="move" data-move="rock">&#9994;&#65039;</button>
      <button class="move" data-move="paper">&#9995;&#65039;</button>
      <button class="move" data-move="scissors">&#9996;&#65039;</button>
    </div>
    <div id="banner" class="banner hidden"></div>
    <div id="timing" class="timing hidden"></div>
    <p id="game-stats" class="stats hidden"></p>
    <div class="result-actions">
      <button id="btn-again" class="primary hidden">Play Again</button>
      <button id="btn-mode" class="hidden">Change mode</button>
    </div>
  </section>

  <!-- The tower between ladder floors. One row per floor of the run, in the order
       the floors are fought, with the player standing on the one the run is on —
       app.js fills it from the stored order, and the fight below it is what sends
       the player up, so the climb is a screen passed through rather than a flash
       over a result still being read. -->
  <section id="ladder" class="view hidden">
    <h2 id="ladder-title">Arcade Mode</h2>
    <div id="ladder-tower" class="tower" role="list" aria-label="Arcade mode floors"></div>
    <div class="ladder-actions">
      <button id="ladder-fight" class="primary">Fight</button>
      <button id="ladder-leave">Change mode</button>
    </div>
  </section>
  <!-- The match history: one <details> per match, in the order they finished,
       with the rounds of a match inside its own row. Collapsed rows keep a full
       record readable on one screen; the rounds are one tap away rather than a
       list of lists left open. app.js fills it from what this browser has
       recorded -- the server keeps none. -->
  <section id="history" class="view hidden">
    <h2>Match History</h2>
    <div id="history-list" class="hist-list" aria-label="Match history"></div>
    <div class="buttons">
      <button id="btn-history-back">Back</button>
    </div>
  </section>

</main>
<script src="/characters.js"></script>
<script src="/machine.js"></script>
<script src="/kxp.js"></script>
<script src="/app.js"></script>
</body>
</html>
